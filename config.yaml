# ============================================================
# 每日財經晨報 設定檔
# 想調整品質，優先改這個檔案與 prompt.txt，不需要碰程式碼
# ============================================================

# ---------- AI 模型 ----------
model: "gemini-2.5-flash"        # 想升級品質可改 gemini-2.5-pro（注意付費層）
max_items_to_ai: 200             # 送給 AI 判斷的新聞上限（依標題時間排序取最新）

# ---------- 新聞來源 ----------
# type: rss  = 直接抓 RSS
# type: gnews = 經 Google News RSS 中繼（給沒有公開 RSS 的媒體）
sources:
  # --- 台灣（5）---
  - name: 鉅亨網台股
    type: gnews
    query: "site:cnyes.com 台股"
    lang: zh
  - name: 經濟日報
    type: rss
    url: https://money.udn.com/rssfeed/news/1001/5591?ch=money
    lang: zh
  - name: 工商時報
    type: gnews
    query: "site:ctee.com.tw"
    lang: zh
  - name: 中央社財經
    type: rss
    url: https://feeds.feedburner.com/rsscna/finance
    lang: zh
  - name: 科技新報
    type: rss
    url: https://technews.tw/feed/
    lang: zh

  # --- 英文（8）---
  - name: CNBC Markets
    type: rss
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258
    lang: en
  - name: MarketWatch
    type: rss
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    lang: en
  - name: Yahoo Finance
    type: rss
    url: https://finance.yahoo.com/news/rssindex
    lang: en
  - name: Investing.com
    type: rss
    url: https://www.investing.com/rss/news.rss
    lang: en
  - name: Fed 新聞稿
    type: rss
    url: https://www.federalreserve.gov/feeds/press_all.xml
    lang: en
  - name: Reuters (via Google News)
    type: gnews
    query: "site:reuters.com markets OR economy OR fed"
    lang: en
  - name: Bloomberg (via Google News)
    type: gnews
    query: "site:bloomberg.com markets OR economy"
    lang: en
  - name: Nikkei Asia (via Google News)
    type: gnews
    query:  "site:asia.nikkei.com"
    lang: en

# ---------- 抓取範圍 ----------
hours_lookback: 26               # 只取最近 N 小時的新聞（26 = 涵蓋前一天早上到現在）

# ---------- 關鍵字層（命中即標必讀，你說了算）----------
must_read_keywords:
  - 上銀
  - 南亞科
  - 記憶體
  - Dram
  - 美光
  - 海力士
  - Samsung
  - 台積電
  - TSMC
  - 聯準會
  - Fed rate
  - FOMC
  - CPI
  - 降息
  - 升息
  - 台指期
  - 期貨商
  - Hynix
  - 三星

# ---------- 熱度層（跨來源重複度）----------
hot_source_threshold: 3          # 同一事件被 N 家以上來源報導 → 自動升級

# ---------- 推播 ----------
telegram_top_n: 5                # Telegram 推播前 N 則必讀
site_url: "https://poulire147.github.io/finance-daily-brief/"                     # 部署後填入 GitHub Pages 網址，推播訊息會附上連結

# ---------- 翻譯用語偏好（會注入 AI prompt）----------
terminology:
  - "Federal Reserve / Fed 一律譯為「聯準會」，禁止使用「美聯儲」"
  - "全部使用繁體中文與台灣用語，禁止出現簡體字或中國大陸用語（如：軟件、視頻、渠道）"
  - "股價漲跌用「上漲／下跌」，指數用「收紅／收黑」皆可"
